name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # No `environment:` block here on purpose: declaring one subjects the job to
    # that environment's protection rules (e.g. a deployment-branch restriction),
    # which on a brand-new repo instantly rejects the run before it ever reaches
    # a runner (conclusion: failure, no steps, no logs). It isn't required for
    # actions/deploy-pages to work — GitHub still associates the deployment with
    # github-pages regardless.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # This is a brand-new repo with Pages never enabled — without this,
          # configure-pages only checks for an existing site and 404s instead
          # of creating one (build_type: workflow) via the API.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
